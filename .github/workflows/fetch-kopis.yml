name: KOPIS 티켓 판매수 받기
on:
  workflow_dispatch:
    inputs:
      what: { description: 'test, 2025, upcoming, range 20241101 20241231, meta 2024 2025 중 하나', default: 'test' }
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fetch_kopis.py ${{ inputs.what }}
      - run: |
          git config user.name "olltime-bot"
          git config user.email "olltime-bot@users.noreply.github.com"
          for f in analysis/kopis_*.json analysis/kopis_*.csv; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || git commit -m "KOPIS 티켓 판매수 받음 (${{ inputs.what }}) · 출처: 공연예술통합전산망(KOPIS)"
          git pull --rebase -q && git push
