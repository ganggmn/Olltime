name: 새 공공데이터 모양 확인
on:
  workflow_dispatch:
    inputs:
      what: { description: 'm, od, od4, fo, topis 중 골라서(빈칸이면 모두)', default: '' }
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q openpyxl
      - run: python scripts/probe_data.py ${{ inputs.what }}
