<style>

:root{--bg:#FAFAFA;--ink:#0A0A0A;--ink-2:#6B6B74;--line:#D4D4D8;--line-weak:#E5E5E5}

.leaflet-tooltip.lb:before{display:none}
</style></head><body>

function draw(){
